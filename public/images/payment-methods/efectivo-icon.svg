<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="billGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fdf4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular con gradiente verde -->
  <circle cx="256" cy="256" r="240" fill="url(#cashGradient)"/>
  
  <!-- Billete estilizado -->
  <g transform="translate(256, 256)">
    <!-- Billete principal -->
    <rect x="-120" y="-80" width="240" height="160" rx="12" fill="url(#billGradient)" stroke="#10B981" stroke-width="3"/>
    
    <!-- Patrón decorativo del billete -->
    <rect x="-110" y="-70" width="220" height="140" rx="8" fill="#10B981" opacity="0.05"/>
    
    <!-- Líneas decorativas horizontales -->
    <line x1="-100" y1="-40" x2="100" y2="-40" stroke="#10B981" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
    <line x1="-100" y1="0" x2="80" y2="0" stroke="#10B981" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
    <line x1="-100" y1="40" x2="100" y2="40" stroke="#10B981" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
    
    <!-- Símbolo S/ prominente en el centro -->
    <circle cx="0" cy="10" r="35" fill="#10B981"/>
    <circle cx="0" cy="10" r="25" fill="white"/>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#10B981" text-anchor="middle" dominant-baseline="central">S/</text>
    
    <!-- Patrón de seguridad (líneas onduladas) -->
    <path d="M -90 -60 Q -60 -50 -30 -60 T 30 -60 Q 60 -50 90 -60" stroke="#10B981" stroke-width="1.5" fill="none" opacity="0.15"/>
    <path d="M -90 60 Q -60 50 -30 60 T 30 60 Q 60 50 90 60" stroke="#10B981" stroke-width="1.5" fill="none" opacity="0.15"/>
  </g>
  
  <!-- Texto "EFECTIVO" en la parte inferior -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4">EFECTIVO</text>
  
  <!-- Elementos decorativos adicionales (monedas pequeñas) -->
  <circle cx="120" cy="120" r="25" fill="white" opacity="0.2"/>
  <circle cx="120" cy="120" r="18" fill="#10B981" opacity="0.3"/>
  <text x="120" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="central">S/</text>
  
  <circle cx="392" cy="120" r="25" fill="white" opacity="0.2"/>
  <circle cx="392" cy="120" r="18" fill="#10B981" opacity="0.3"/>
  <text x="392" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="central">S/</text>
  
  <circle cx="120" cy="392" r="25" fill="white" opacity="0.2"/>
  <circle cx="120" cy="392" r="18" fill="#10B981" opacity="0.3"/>
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="central">S/</text>
  
  <circle cx="392" cy="392" r="25" fill="white" opacity="0.2"/>
  <circle cx="392" cy="392" r="18" fill="#10B981" opacity="0.3"/>
  <text x="392" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="central">S/</text>
</svg>
